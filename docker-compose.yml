version: '3.8'

networks:
  scalegrad-net:
    driver: bridge
    # The network name will automatically be prefixed by COMPOSE_PROJECT_NAME

volumes:
  postgres_data:
  redis_data:
  uploads_data:

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-hackfusion}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
  PAYU_MERCHANT_KEY: ${PAYU_MERCHANT_KEY:?PAYU_MERCHANT_KEY must be set}
  PAYU_MERCHANT_ID: ${PAYU_MERCHANT_ID:?PAYU_MERCHANT_ID must be set}
  PAYU_SUCCESS_URL: ${PAYU_SUCCESS_URL:-http://localhost/payment/success}
  PAYU_FAILURE_URL: ${PAYU_FAILURE_URL:-http://localhost/payment/failure}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}

services:
  db:
    image: postgres:15-alpine
    networks: [scalegrad-net]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-hackfusion}
    env_file: [.env]
    # Optionally expose to host based on dynamic .env
    ports:
      - "${DB_EXTERNAL_PORT:-127.0.0.1:54320}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hackfusion}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    networks: [scalegrad-net]
    volumes:
      - redis_data:/data
    # Optionally expose to host based on dynamic .env
    ports:
      - "${REDIS_EXTERNAL_PORT:-127.0.0.1:63790}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks: [scalegrad-net]
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *api-env
    env_file: [.env]
    expose:
      - "5000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.worker worker --loglevel=info --concurrency=4
    networks: [scalegrad-net]
    depends_on:
      - redis
      - db
    environment:
      <<: *api-env
    env_file: [.env]
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    networks: [scalegrad-net]
    depends_on:
      - redis
      - db
    environment:
      <<: *api-env
    env_file: [.env]
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks: [scalegrad-net]
    environment:
      VITE_API_URL: /api
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    networks: [scalegrad-net]
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
