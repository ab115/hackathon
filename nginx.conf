worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;       # Increased for 100K concurrent users
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    server_tokens      off;

    # Gzip compression (significant savings on JSON API responses)
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ─────────────────────────────────────────────
    # Rate limiting zones — sized for 100K IPs
    # 1 byte tracks ~1 IP → 50m zone = ~800K IPs
    # ─────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_zone:50m   rate=200r/m;
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m  rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:50m;

    # Use Docker DNS resolver for dynamic upstream re-resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─────────────────────────────────────────────
    # Pass the real protocol from upstream proxies
    # (ngrok sets X-Forwarded-Proto: https;
    #  fall back to $scheme for direct access)
    # ─────────────────────────────────────────────
    map $http_x_forwarded_proto $real_proto {
        default  $scheme;
        https    https;
        http     http;
    }

    # ─────────────────────────────────────────────
    # Upstream — connection pool to API replicas
    # proxy_next_upstream retries on unhealthy backends
    # ─────────────────────────────────────────────
    upstream backend_api {
        server api:5000 max_fails=3 fail_timeout=30s;
        keepalive 64;
        keepalive_requests 10000;
        keepalive_time     1h;
    }

    upstream jirathon_api {
        server jirathon-api:8000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream frontend_ui {
        server frontend:80;
        keepalive 16;
    }

    # ─────────────────────────────────────────────
    # Shared proxy config (DRY)
    # ─────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $real_proto;
    proxy_set_header   X-Forwarded-Host  $http_host;

    # Retry on upstream errors — transparent failover across API replicas
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    # Response buffering
    proxy_buffering    on;
    proxy_buffer_size  8k;
    proxy_buffers      16 32k;
    proxy_busy_buffers_size 64k;

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options          SAMEORIGIN           always;
        add_header X-Content-Type-Options   nosniff              always;
        add_header X-XSS-Protection         "1; mode=block"      always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;

        # Allow 50 concurrent connections per IP (prevents slow-loris)
        limit_conn conn_limit 50;

        # Upload size limit (banner images + project submissions)
        client_max_body_size    50M;
        client_body_timeout     60s;
        client_header_timeout   30s;

        # ─────────────────────────────────────────────
        # Auth endpoints — tightest rate limit
        # ─────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend_api;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ─────────────────────────────────────────────
        # General API
        # ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend_api;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }

        # ─────────────────────────────────────────────
        # Jirathon API
        # ─────────────────────────────────────────────
        location /jirathon-api/ {
            limit_req zone=api_zone burst=50 nodelay;
            limit_req_status 429;

            proxy_pass         http://jirathon_api/;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }

        # ─────────────────────────────────────────────
        # File uploads — larger timeout, no rate limit
        # ─────────────────────────────────────────────
        location ~ ^/api/(users/me/avatar|hackathons/upload-banner) {
            proxy_pass         http://backend_api;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            # Disable next-upstream for upload endpoints (non-idempotent)
            proxy_next_upstream off;
        }

        # ─────────────────────────────────────────────
        # Static uploads (served directly, never hits API)
        # ─────────────────────────────────────────────
        location /uploads/ {
            alias      /app/uploads/;
            expires    7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            
            # Ensure documents are served inline for embedding
            types {
                image/jpeg  jpg jpeg;
                image/png   png;
                image/webp  webp;
                application/pdf pdf;
                application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
                text/plain txt;
            }
            
            add_header Content-Disposition "inline" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ─────────────────────────────────────────────
        # Frontend SPA (with HMR WebSocket support)
        # ─────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend_ui;
            proxy_set_header   Upgrade     $http_upgrade;
            proxy_set_header   Connection  "upgrade";
            proxy_read_timeout 300s;
        }

        # ─────────────────────────────────────────────
        # Custom error responses
        # ─────────────────────────────────────────────
        error_page 429 @rate_limited;
        location @rate_limited {
            return 429 '{"detail":"Too many requests. Please slow down.","code":"RATE_LIMITED"}';
            add_header Content-Type application/json always;
        }

        error_page 502 503 @upstream_error;
        location @upstream_error {
            return 503 '{"detail":"Service temporarily unavailable. Please retry.","code":"UPSTREAM_ERROR"}';
            add_header Content-Type application/json always;
            add_header Retry-After 5 always;
        }
    }
}
